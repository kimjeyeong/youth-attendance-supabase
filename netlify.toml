# Netlify 배포 설정
# 앱이 frontend/ 하위에 있으므로 base 를 지정해야 한다.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"          # base 기준 상대경로 → frontend/dist

# 단일 페이지 앱: 어떤 경로로 들어와도 index.html 을 돌려준다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
