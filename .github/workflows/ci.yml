name: CI

# 배포는 Cloudflare Pages 가 저장소를 직접 빌드해서 처리한다.
# 이 워크플로는 검사만 한다. GitHub Pages 로 두 번째 사본을 공개하면
# 보안 헤더가 붙지 않은 출석 앱이 하나 더 떠 있게 되므로 배포하지 않는다.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      # 실제 키 없이 빌드가 깨지지 않는지만 확인한다.
      - name: Build
        working-directory: frontend
        env:
          VITE_ALLOW_MOCK_BUILD: 'true'
        run: npm run build

      # public/ 이 dist/ 최상단으로 복사되지 않으면 보안 헤더가 통째로 사라진다.
      - name: Verify security headers ship with the build
        working-directory: frontend
        run: |
          test -f dist/_headers || { echo '::error::dist/_headers 가 없습니다'; exit 1; }
          test -f dist/_redirects || { echo '::error::dist/_redirects 가 없습니다'; exit 1; }
          grep -q "frame-ancestors 'none'" dist/_headers || { echo '::error::CSP frame-ancestors 누락'; exit 1; }
          grep -q 'Strict-Transport-Security' dist/_headers || { echo '::error::HSTS 누락'; exit 1; }
          echo 'dist/_headers, dist/_redirects 확인 완료'
